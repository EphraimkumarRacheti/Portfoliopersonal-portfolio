<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Portfolio Portal</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Admin CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body class="login-body">

    <div class="login-container">
        <div class="glass-card login-card">
            <div class="login-header">
                <a href="/" class="login-logo">&lt;Ephraim Kumar<span class="logo-accent">/&gt;</span></a>
                <h2>Admin Login</h2>
                <p>Sign in with your Supabase Auth administrator account</p>
            </div>

            <form id="admin-login-form" novalidate>
                <div class="form-group">
                    <label for="email">Admin Email <span class="required">*</span></label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-envelope input-icon"></i>
                        <input type="email" id="email" name="email" placeholder="admin@ephraim.com" required autocomplete="email">
                    </div>
                    <span class="error-msg" id="email-error"></span>
                </div>

                <div class="form-group">
                    <label for="password">Password <span class="required">*</span></label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
                    </div>
                    <span class="error-msg" id="password-error"></span>
                </div>

                <button type="submit" class="btn btn-primary btn-full" id="login-submit-btn">
                    <span class="btn-text">Sign In to Dashboard</span>
                    <i class="fa-solid fa-arrow-right-to-bracket btn-icon"></i>
                    <span class="spinner" id="login-spinner" style="display:none;" aria-hidden="true"></span>
                </button>

                <div class="form-status" id="login-status" role="alert"></div>
            </form>

            <div class="login-footer">
                <a href="/"><i class="fa-solid fa-arrow-left"></i> Return to Public Portfolio</a>
            </div>
        </div>
    </div>

    <!-- Admin JS -->
    <script src="{{ url_for('static', filename='js/admin.js') }}"></script>
</body>
</html>
